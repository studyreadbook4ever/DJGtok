name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q
      - run: python examples/quickstart.py
      - run: djgtok demo
      - run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('openpyxl') is None"
      - run: python -m build
      - run: python -m twine check --strict dist/*

  extras:
    name: Optional Seoul and neural modules / CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[dev,seoul,torch]"
      - run: python -m pytest -q
