[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "DJGtok"
version = "0.1.0"
description = "Directed transit tokenization and explainable shared-corridor matching"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "DJGtok contributors"}]
keywords = ["transit", "tokenization", "gtfs", "trajectory", "public-transport"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26,<3", "pydantic>=2.10,<3"]

[project.optional-dependencies]
seoul = ["openpyxl>=3.1,<4"]
torch = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "twine>=6,<7"]

[project.scripts]
djgtok = "djgtok.cli:main"

[project.urls]
Homepage = "https://github.com/studyreadbook4ever/DJGtok"
Repository = "https://github.com/studyreadbook4ever/DJGtok"
Issues = "https://github.com/studyreadbook4ever/DJGtok/issues"
Documentation = "https://github.com/studyreadbook4ever/DJGtok/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
djgtok = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Optional-dependency modules must be skipped before importing their adapters.
"tests/test_model.py" = ["E402"]
"tests/test_seoul.py" = ["E402"]
